<!doctype html><html lang="ms"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#641522"><link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Senarai Semak Tugasan Guru Besar Daerah Besut</title>
<style>
:root{--m:#641522;--m2:#8e2b3c;--bg:#f7efed;--card:#fff;--ink:#302324;--muted:#806f6c;--line:#e6d5d1;--ok:#21834f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
header{background:linear-gradient(135deg,#641522,#410e16);color:#fff;padding:16px;box-shadow:0 4px 14px #0003}.top{max-width:1180px;margin:auto;display:flex;align-items:center;gap:14px}.logo{width:70px;height:70px;border:2px dashed #fff8;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.top h1{font-size:20px;margin:0 0 5px}.top p{margin:0;font-size:12px;opacity:.9}
main{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px #4d16200d}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #d8c6c1;border-radius:9px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#f5e8e5;border-radius:13px;padding:13px}.stat b{display:block;color:var(--m);font-size:23px}.stat span{font-size:12px;color:var(--muted)}.progress{height:9px;background:#e8d9d5;border-radius:20px;margin-top:7px;overflow:hidden}.bar{height:100%;width:0;background:var(--ok)}
.tabs,.actions,.months{display:flex;gap:7px;flex-wrap:wrap}.btn,.tab,.month{border:0;border-radius:9px;padding:10px 13px;font-weight:bold;cursor:pointer}.btn{background:var(--m);color:#fff}.btn.alt,.tab,.month{background:#eee0dc;color:var(--m)}.tab.active,.month.active{background:var(--m);color:#fff}
.months{margin-top:12px}.month{font-size:12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.sectionhead h2{font-size:18px;margin:0}.task{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:12px 3px;border-bottom:1px solid #eee;align-items:start}.task:last-child{border:0}.task input{width:20px;height:20px;accent-color:var(--ok)}.txt{font-weight:600;font-size:14px}.done .txt{text-decoration:line-through;color:#94827e}.meta{font-size:11px;color:var(--muted);margin-top:4px}.taskbtn{border:0;background:none;color:var(--m);font-weight:bold;cursor:pointer;margin-left:8px}.empty{text-align:center;color:var(--muted);padding:28px}.note{font-size:12px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.dialog{background:#fff;width:100%;max-width:560px;border-radius:16px;padding:18px}.dialog h3{margin-top:0}.dialogfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.printonly{display:none}
@media(max-width:850px){.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.stats{grid-template-columns:1fr}.top h1{font-size:16px}.task{grid-template-columns:28px 1fr}.task .edit{grid-column:2}}
@media print{header,.no-print{display:none!important}body{background:#fff}.card{border:0;box-shadow:none}.printonly{display:block!important}}
</style></head><body>
<header><div class="top"><div class="logo" id="logoBox">LOGO<br>SEKOLAH</div><div><h1>SENARAI SEMAK TUGASAN GURU BESAR DAERAH BESUT</h1><p>Pengurusan Harian • Bulanan • Tahunan</p></div></div></header>
<main>
<section class="card no-print"><div class="grid">
<div class="field"><label>Nama Sekolah</label><input id="school" placeholder="Nama sekolah"></div>
<div class="field"><label>Nama Guru Besar</label><input id="head" placeholder="Nama Guru Besar"></div>
<div class="field"><label>Tahun</label><input id="year" type="number"></div>
<div class="field"><label>Logo Sekolah</label><input id="logo" type="file" accept="image/*"></div>
</div><div class="stats">
<div class="stat"><b id="total">0</b><span>Jumlah tugasan</span></div><div class="stat"><b id="done">0</b><span>Selesai</span></div>
<div class="stat"><b id="pending">0</b><span>Belum selesai</span></div><div class="stat"><b id="pct">0%</b><span>Kemajuan</span><div class="progress"><div class="bar" id="bar"></div></div></div>
</div></section>
<section class="card no-print"><div class="tabs"><button class="tab active" data-cat="Harian">📅 Harian</button><button class="tab" data-cat="Bulanan">📆 Bulanan</button><button class="tab" data-cat="Tahunan">🗓️ Tahunan</button></div><div id="months" class="months" style="display:none"></div></section>
<section class="card"><div class="sectionhead"><h2 id="heading"></h2><div class="actions no-print"><button class="btn" onclick="add()">＋ Tambah</button><button class="btn alt" onclick="printIt()">🖨 Cetak</button></div></div><div id="list"></div></section>
<section class="card no-print"><div class="actions"><button class="btn alt" onclick="save(true)">💾 Simpan</button><button class="btn alt" onclick="backup()">⬇ Sandaran</button><button class="btn alt" onclick="restore.click()">⬆ Pulihkan</button><button class="btn" onclick="window.print()">🖨 Cetak</button><input id="restore" type="file" accept=".json" hidden></div><p class="note">Senarai asas ini ialah alat bantu pengurusan dan boleh disesuaikan mengikut arahan KPM, JPN, PPD dan keperluan sekolah semasa.</p></section>
<div id="print" class="printonly"></div></main>
<div id="modal" class="modal"><div class="dialog"><h3 id="mtitle">Tambah Tugasan</h3><div class="field"><label>Tugasan / Program</label><textarea id="text" rows="3"></textarea></div><div class="grid"><div class="field"><label>Kategori</label><select id="catSel"><option>Harian</option><option>Bulanan</option><option>Tahunan</option></select></div><div class="field"><label>Tarikh</label><input id="date" type="date"></div></div><div class="field"><label>Catatan / Rujukan</label><textarea id="note" rows="2"></textarea></div><div class="dialogfoot"><button class="btn alt" onclick="closeM()">Batal</button><button class="btn" onclick="saveTask()">Simpan</button></div></div></div>
<script>
const KEY="GB_BESUT_V3";const months=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
const seed=[{"id": 1, "cat": "Harian", "text": "Semak kehadiran guru, AKP dan murid serta tindakan susulan ketidakhadiran.", "date": "", "note": "", "done": false}, {"id": 2, "cat": "Harian", "text": "Semak pergerakan guru dan AKP serta keperluan penggantian jika berkaitan.", "date": "", "note": "", "done": false}, {"id": 3, "cat": "Harian", "text": "Memastikan pengoperasian sekolah berjalan mengikut ketetapan semasa.", "date": "", "note": "", "done": false}, {"id": 4, "cat": "Harian", "text": "Memantau pelaksanaan pengajaran dan pembelajaran serta isu yang memerlukan tindakan.", "date": "", "note": "", "done": false}, {"id": 5, "cat": "Harian", "text": "Semak keadaan keselamatan, kebersihan, keceriaan dan persekitaran sekolah.", "date": "", "note": "", "done": false}, {"id": 6, "cat": "Harian", "text": "Semak isu disiplin, kebajikan dan keselamatan murid.", "date": "", "note": "", "done": false}, {"id": 7, "cat": "Harian", "text": "Semak surat, arahan dan makluman rasmi yang diterima.", "date": "", "note": "", "done": false}, {"id": 8, "cat": "Harian", "text": "Semak tugasan penting dan tindakan susulan yang perlu diselesaikan.", "date": "", "note": "", "done": false}, {"id": 9, "cat": "Harian", "text": "Memantau pelaksanaan program dan aktiviti sekolah pada hari berkenaan.", "date": "", "note": "", "done": false}, {"id": 10, "cat": "Harian", "text": "Semak aduan, isu ibu bapa/penjaga dan tindakan penyelesaian.", "date": "", "note": "", "done": false}, {"id": 11, "cat": "Harian", "text": "Semak keperluan segera berkaitan kewangan, perolehan, aset atau penyelenggaraan.", "date": "", "note": "", "done": false}, {"id": 12, "cat": "Harian", "text": "Catat perkara penting dan keputusan/tindakan susulan dalam rekod pengurusan.", "date": "", "note": "", "done": false}, {"id": 13, "cat": "Bulanan", "text": "Semak analisis kehadiran murid dan guru serta tindakan susulan.", "date": "", "note": "", "done": false}, {"id": 14, "cat": "Bulanan", "text": "Semak pencapaian dan isu kurikulum berdasarkan pemantauan sekolah.", "date": "", "note": "", "done": false}, {"id": 15, "cat": "Bulanan", "text": "Semak pelaksanaan program Hal Ehwal Murid dan kebajikan murid.", "date": "", "note": "", "done": false}, {"id": 16, "cat": "Bulanan", "text": "Semak pelaksanaan kokurikulum, sukan dan aktiviti murid.", "date": "", "note": "", "done": false}, {"id": 17, "cat": "Bulanan", "text": "Semak kedudukan kewangan, perbelanjaan dan dokumen berkaitan mengikut ketetapan.", "date": "", "note": "", "done": false}, {"id": 18, "cat": "Bulanan", "text": "Semak pengurusan aset, inventori, penyelenggaraan dan kemudahan sekolah.", "date": "", "note": "", "done": false}, {"id": 19, "cat": "Bulanan", "text": "Semak pengurusan perkhidmatan, perjawatan dan keperluan sumber manusia.", "date": "", "note": "", "done": false}, {"id": 20, "cat": "Bulanan", "text": "Semak data dan maklumat sekolah supaya dikemas kini mengikut sistem/tempoh yang ditetapkan.", "date": "", "note": "", "done": false}, {"id": 21, "cat": "Bulanan", "text": "Semak pelaksanaan mesyuarat, taklimat dan tindakan susulan.", "date": "", "note": "", "done": false}, {"id": 22, "cat": "Bulanan", "text": "Semak program intervensi bagi murid yang memerlukan sokongan.", "date": "", "note": "", "done": false}, {"id": 23, "cat": "Bulanan", "text": "Semak aspek keselamatan sekolah dan tindakan pembaikan.", "date": "", "note": "", "done": false}, {"id": 24, "cat": "Bulanan", "text": "Semak pelaksanaan aktiviti prasekolah/pendidikan khas jika berkaitan.", "date": "", "note": "", "done": false}, {"id": 25, "cat": "Bulanan", "text": "Semak pengurusan bantuan dan kebajikan murid yang berkaitan.", "date": "", "note": "", "done": false}, {"id": 26, "cat": "Bulanan", "text": "Semak status surat, aduan dan tindakan susulan yang masih terbuka.", "date": "", "note": "", "done": false}, {"id": 27, "cat": "Bulanan", "text": "Sediakan ringkasan pencapaian, isu, risiko dan tindakan bulan berkenaan.", "date": "", "note": "", "done": false}, {"id": 28, "cat": "Tahunan", "text": "Semak perancangan dan takwim pengoperasian sekolah bagi tahun semasa.", "date": "", "note": "", "done": false}, {"id": 29, "cat": "Tahunan", "text": "Semak pembahagian tugas dan pengoperasian jawatankuasa sekolah.", "date": "", "note": "", "done": false}, {"id": 30, "cat": "Tahunan", "text": "Semak perancangan kurikulum, HEM dan kokurikulum.", "date": "", "note": "", "done": false}, {"id": 31, "cat": "Tahunan", "text": "Semak sasaran, pelan tindakan dan keutamaan sekolah.", "date": "", "note": "", "done": false}, {"id": 32, "cat": "Tahunan", "text": "Semak pengurusan pendaftaran dan penempatan murid.", "date": "", "note": "", "done": false}, {"id": 33, "cat": "Tahunan", "text": "Semak pengurusan kehadiran dan intervensi murid.", "date": "", "note": "", "done": false}, {"id": 34, "cat": "Tahunan", "text": "Semak pelaksanaan program keselamatan dan perlindungan murid.", "date": "", "note": "", "done": false}, {"id": 35, "cat": "Tahunan", "text": "Semak pengurusan kewangan, perolehan dan peruntukan sekolah.", "date": "", "note": "", "done": false}, {"id": 36, "cat": "Tahunan", "text": "Semak pengurusan aset, inventori dan penyelenggaraan.", "date": "", "note": "", "done": false}, {"id": 37, "cat": "Tahunan", "text": "Semak pengurusan bantuan persekolahan yang berkaitan.", "date": "", "note": "", "done": false}, {"id": 38, "cat": "Tahunan", "text": "Semak program sukan, kokurikulum dan penglibatan murid.", "date": "", "note": "", "done": false}, {"id": 39, "cat": "Tahunan", "text": "Semak program pembangunan profesional dan kompetensi guru/AKP.", "date": "", "note": "", "done": false}, {"id": 40, "cat": "Tahunan", "text": "Semak pengurusan prasekolah dan/atau pendidikan khas jika berkaitan.", "date": "", "note": "", "done": false}, {"id": 41, "cat": "Tahunan", "text": "Semak pengurusan data, rekod dan dokumen sekolah.", "date": "", "note": "", "done": false}, {"id": 42, "cat": "Tahunan", "text": "Semak pelaksanaan program dan jaringan strategik dengan pihak berkepentingan.", "date": "", "note": "", "done": false}, {"id": 43, "cat": "Tahunan", "text": "Semak laporan pencapaian sekolah dan keberkesanan intervensi.", "date": "", "note": "", "done": false}, {"id": 44, "cat": "Tahunan", "text": "Semak isu audit, pematuhan dan tindakan pembetulan jika berkaitan.", "date": "", "note": "", "done": false}, {"id": 45, "cat": "Tahunan", "text": "Adakan semakan akhir tahun terhadap pencapaian, risiko dan penambahbaikan.", "date": "", "note": "", "done": false}, {"id": 46, "cat": "Tahunan", "text": "Sediakan pelaporan akhir tahun dan dokumentasi yang diperlukan.", "date": "", "note": "", "done": false}, {"id": 47, "cat": "Tahunan", "text": "Rancang persediaan pengoperasian bagi sesi/tahun persekolahan berikutnya.", "date": "", "note": "", "done": false}];
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{school:"",head:"",year:new Date().getFullYear(),logo:"",tasks:seed};
let cat="Harian",month=0,editId=null;
const $=x=>document.getElementById(x);
$("school").value=S.school;$("head").value=S.head;$("year").value=S.year;if(S.logo)$("logoBox").innerHTML="<img src='"+S.logo+"'>";
["school","head","year"].forEach(id=>$(id).oninput=()=>{S.school=$("school").value;S.head=$("head").value;S.year=$("year").value;save(false)});
$("logo").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{S.logo=r.result;$("logoBox").innerHTML="<img src='"+S.logo+"'>";save(false)};r.readAsDataURL(f)};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;month=0;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});
function save(show){localStorage.setItem(KEY,JSON.stringify(S));if(show)alert("Data berjaya disimpan.");}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(d){if(!d)return"";return new Date(d+"T00:00:00").toLocaleDateString("ms-MY",{day:"2-digit",month:"2-digit",year:"numeric"})}
function visible(){let a=S.tasks.filter(t=>t.cat===cat);if(cat==="Bulanan")a=a.filter(t=>!t.date||new Date(t.date+"T00:00:00").getMonth()===month);return a}
function render(){
$("heading").textContent="Tugasan "+cat+(cat==="Bulanan"?" • "+months[month]:"");
let a=visible();$("list").innerHTML=a.length?a.map(t=>`<div class="task ${t.done?"done":""}"><input type="checkbox" ${t.done?"checked":""} onchange="toggle(${t.id})"><div><div class="txt">${esc(t.text)}</div><div class="meta">${t.date?"Tarikh: "+fmt(t.date)+" • ":""}${t.note?esc(t.note):"Tiada catatan"}</div></div><div class="edit"><button class="taskbtn" onclick="edit(${t.id})">Edit</button><button class="taskbtn" onclick="del(${t.id})">Padam</button></div></div>`).join(""):'<div class="empty">Tiada tugasan. Tekan “＋ Tambah” untuk memasukkan tugasan.</div>';
let total=S.tasks.length,done=S.tasks.filter(t=>t.done).length,p=total?Math.round(done/total*100):0;$("total").textContent=total;$("done").textContent=done;$("pending").textContent=total-done;$("pct").textContent=p+"%";$("bar").style.width=p+"%";
let m=$("months");if(cat==="Bulanan"){m.style.display="flex";m.innerHTML=months.map((x,i)=>`<button class="month ${i===month?"active":""}" onclick="month=${i};render()">${x}</button>`).join("")}else m.style.display="none";
}
function add(){editId=null;$("mtitle").textContent="Tambah Tugasan";$("text").value="";$("date").value="";$("note").value="";$("catSel").value=cat;$("modal").classList.add("show")}
function edit(id){let t=S.tasks.find(x=>x.id===id);editId=id;$("mtitle").textContent="Kemaskini Tugasan";$("text").value=t.text;$("date").value=t.date||"";$("note").value=t.note||"";$("catSel").value=t.cat;$("modal").classList.add("show")}
function closeM(){$("modal").classList.remove("show")}
function saveTask(){let text=$("text").value.trim();if(!text)return alert("Sila masukkan tugasan.");let o={text,cat:$("catSel").value,date:$("date").value,note:$("note").value.trim()};if(editId){let t=S.tasks.find(x=>x.id===editId);Object.assign(t,o)}else S.tasks.push({id:Date.now(),...o,done:false});save(false);closeM();render()}
function toggle(id){let t=S.tasks.find(x=>x.id===id);t.done=!t.done;save(false);render()}
function del(id){if(confirm("Padam tugasan ini?")){S.tasks=S.tasks.filter(x=>x.id!==id);save(false);render()}}
function backup(){save(false);let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Sandaran_Guru_Besar_Besut_"+S.year+".json";a.click();URL.revokeObjectURL(a.href)}
$("restore").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.tasks))throw 0;localStorage.setItem(KEY,JSON.stringify(x));location.reload()}catch{alert("Fail sandaran tidak sah.")}};r.readAsText(f)}
function printIt(){let groups=["Harian","Bulanan","Tahunan"];$("print").innerHTML=`<h1>${esc(S.school||"NAMA SEKOLAH")}</h1><p>Guru Besar: ${esc(S.head||"")} &nbsp; Tahun: ${S.year}</p><h2>SENARAI SEMAK TUGASAN GURU BESAR DAERAH BESUT</h2>`+groups.map(c=>`<h2>${c}</h2>`+S.tasks.filter(t=>t.cat===c).map(t=>`<div style="padding:7px;border-bottom:1px solid #ddd">□ ${esc(t.text)} ${t.date?"("+fmt(t.date)+")":""}</div>`).join("")).join("");window.print()}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
